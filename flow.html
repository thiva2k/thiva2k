<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BookVerse | Reading Flow</title>
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="container">
      <h1>Reading Flow</h1>
      <section class="card">
        <h2>Cozy Sounds</h2>
        <button id="soundToggle" class="btn">Play Cozy Sound</button>
        <audio id="cozyAudio" loop src="https://upload.wikimedia.org/wikipedia/commons/4/47/Ambience_night.ogg"></audio>
      </section>
      <section class="card">
        <h2>Completed Books</h2>
        <form id="completeForm" class="form-grid">
          <input id="completedTitle" type="text" placeholder="Book title" required />
          <button class="btn" type="submit">Mark Completed</button>
        </form>
        <ul id="completedList"></ul>
      </section>
    </main>
    <script type="module" src="js/flow.js"></script>
  </body>
</html>
